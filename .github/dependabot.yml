# Catena di fornitura: aggiornamenti automatici delle dipendenze. Cadenza settimanale per non
# sommergere le pull request; ogni aggiornamento passa dalla CI come qualsiasi altra modifica.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript è vincolato dal peer range di @angular/build (oggi ">=6.0 <6.1"), non da una
      # sua scelta propria: un salto di versione maggiore rompe "npm ci" con un conflitto ERESOLVE
      # (vedi giorgiorest/gestionale#150) e va fatto insieme a un aggiornamento di Angular, non da
      # solo come aggiornamento di routine.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Un salto di versione maggiore (es. 3.5.x → 4.x) porta incompatibilità reali (vedi
      # giorgiorest/gestionale#149: spring-boot-starter-parent 4.2.0 ha smesso di gestire la
      # versione di org.testcontainers:junit-jupiter/postgresql, rompendo la build) e va valutato
      # e testato a parte, non proposto come un aggiornamento di routine.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Immagine base di infra/docker/web.Dockerfile (build Node e nginx finale).
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Immagine base di apps/api/Dockerfile (Eclipse Temurin).
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
