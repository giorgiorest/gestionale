name: Collegamento SSH al server
description: >
  Configura l'alias SSH "server" verso la macchina di produzione, con la chiave del deploy e
  l'impronta della macchina verificata (StrictHostKeyChecking). Usata da Deploy e Prepara server.

inputs:
  host:
    description: Indirizzo della macchina (secret OCI_SSH_HOST)
    required: true
  user:
    description: Utente SSH (secret OCI_SSH_USER, di solito ubuntu)
    required: true
  private-key:
    description: Chiave privata del deploy (secret OCI_SSH_PRIVATE_KEY)
    required: true
  known-hosts:
    description: Riga dell'impronta della macchina (secret OCI_SSH_KNOWN_HOSTS)
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.user }}
        SSH_KEY: ${{ inputs.private-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        missing=""
        [ -n "$SSH_HOST" ] || missing="$missing OCI_SSH_HOST"
        [ -n "$SSH_USER" ] || missing="$missing OCI_SSH_USER"
        [ -n "$SSH_KEY" ] || missing="$missing OCI_SSH_PRIVATE_KEY"
        [ -n "$KNOWN_HOSTS" ] || missing="$missing OCI_SSH_KNOWN_HOSTS"
        if [ -n "$missing" ]; then
          echo "::error::Mancano nell'environment production i secrets:$missing (docs/deploy-vps.md)."
          exit 1
        fi
        install -m 700 -d ~/.ssh
        # Valori incollati da Windows o dal browser: via spazi agli estremi e ritorni a capo (\r).
        host=$(printf '%s' "$SSH_HOST" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
        printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        # Impronta: tiene solo le righe di chiave (non i commenti "# host:22 SSH-2.0…" di ssh-keyscan);
        # una riga che inizia direttamente con il tipo di chiave riceve l'indirizzo davanti.
        printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e '/^#/d' -e '/^$/d' |
          awk -v h="$host" '$1 ~ /^(ssh-|ecdsa-|sk-)/ { print h, $0; next } { print }' > ~/.ssh/known_hosts
        if [ ! -s ~/.ssh/known_hosts ]; then
          echo "::error::OCI_SSH_KNOWN_HOSTS non contiene una riga di chiave (attesa: <IP> ssh-ed25519 AAAA…). Rigenerala come in docs/deploy-vps.md, passo 3."
          exit 1
        fi
        if ! awk -v h="$host" '{ n = split($1, names, ","); for (i = 1; i <= n; i++) if (names[i] == h || names[i] == "[" h "]:22") found = 1 } END { exit !found }' ~/.ssh/known_hosts; then
          echo "::error::La riga di OCI_SSH_KNOWN_HOSTS inizia con un indirizzo diverso da OCI_SSH_HOST: devono essere uguali (es. entrambi l'IP del server)."
          exit 1
        fi
        if ! ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null 2>&1; then
          echo "::error::La chiave in OCI_SSH_KNOWN_HOSTS non è valida (copiata incompleta?). Rigenerala come in docs/deploy-vps.md, passo 3."
          exit 1
        fi
        echo "Impronta del server: $(ssh-keygen -l -f ~/.ssh/known_hosts | awk '{ print $4, $2 }' | head -n 1)"
        {
          echo "Host server"
          echo "  HostName $host"
          echo "  User $(printf '%s' "$SSH_USER" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          echo "  IdentityFile ~/.ssh/id_deploy"
          echo "  IdentitiesOnly yes"
          echo "  StrictHostKeyChecking yes"
          echo "  ServerAliveInterval 30"
        } > ~/.ssh/config
        if ! ssh -o BatchMode=yes -o ConnectTimeout=20 server true; then
          echo "::error::Collegamento SSH a $SSH_USER@$host non riuscito. «Host key verification failed»: l'impronta in OCI_SSH_KNOWN_HOSTS non è quella del server. «Permission denied»: manca la chiave pubblica del deploy in ~/.ssh/authorized_keys sulla macchina, o OCI_SSH_PRIVATE_KEY è incompleta (docs/deploy-vps.md)."
          exit 1
        fi
