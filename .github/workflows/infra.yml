name: Infrastruttura

# Crea o aggiorna su Oracle Cloud la rete, le porte, la macchina e l'IP fisso di produzione
# (Terraform, infra/terraform/oracle). Manuale, oppure richiamato da "Infrastruttura (tentativi)".
# Guida: infra/terraform/oracle/README.md
#
# Configurazione nell'environment GitHub "oracle-cloud" (Settings → Environments):
#   secrets:   OCI_TENANCY_OCID, OCI_USER_OCID, OCI_FINGERPRINT, OCI_PRIVATE_KEY
#   variables: OCI_REGION, OCI_NAMESPACE, OCI_SSH_PUBLIC_KEYS,
#              OCI_STATE_BUCKET (facoltativa, default civilbeefy-tfstate),
#              OCI_OCPUS e OCI_MEMORY_GB (facoltative, default 2 e 12)

on:
  workflow_dispatch:
    inputs:
      action:
        description: plan = mostra cosa cambierebbe; apply = applica
        type: choice
        options: [plan, apply]
        default: plan
      small_shape_fallback:
        description: Se manca capacità, riprova con 1 OCPU e 6 GB
        type: boolean
        default: true
      allow_destroy:
        description: Consenti di eliminare o ricreare risorse (es. la macchina). Attenzione ai dati.
        type: boolean
        default: false
  workflow_call:
    inputs:
      action:
        type: string
        default: apply
      small_shape_fallback:
        type: boolean
        default: true
      allow_destroy:
        type: boolean
        default: false
    outputs:
      ready:
        description: true se la macchina esiste
        value: ${{ jobs.terraform.outputs.ready }}

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: oracle-cloud
    concurrency:
      group: oracle-infra
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.run.outputs.ready }}
    defaults:
      run:
        working-directory: infra/terraform/oracle
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_ssh_public_keys: ${{ vars.OCI_SSH_PUBLIC_KEYS }}
      TF_VAR_ocpus: ${{ vars.OCI_OCPUS || '2' }}
      TF_VAR_memory_gb: ${{ vars.OCI_MEMORY_GB || '12' }}
      OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
      OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET || 'civilbeefy-tfstate' }}
      ACTION: ${{ inputs.action }}
      SMALL_SHAPE_FALLBACK: ${{ inputs.small_shape_fallback }}
      ALLOW_DESTROY: ${{ inputs.allow_destroy }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Credenziali di Oracle Cloud
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          missing=""
          for pair in TF_VAR_tenancy_ocid:OCI_TENANCY_OCID TF_VAR_user_ocid:OCI_USER_OCID \
                      TF_VAR_fingerprint:OCI_FINGERPRINT OCI_PRIVATE_KEY:OCI_PRIVATE_KEY \
                      TF_VAR_region:OCI_REGION OCI_NAMESPACE:OCI_NAMESPACE \
                      TF_VAR_ssh_public_keys:OCI_SSH_PUBLIC_KEYS; do
            env_name="${pair%%:*}"
            [ -n "${!env_name}" ] || missing="$missing ${pair#*:}"
          done
          if [ -n "$missing" ]; then
            echo "::error::Mancano nell'environment oracle-cloud:$missing (vedi infra/terraform/oracle/README.md)"; exit 1
          fi
          key="$RUNNER_TEMP/oci_api_key.pem"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          echo "TF_VAR_private_key_path=$key" >> "$GITHUB_ENV"
          # Configurazione dello stato (Object Storage), fuori dal repository.
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket           = "$OCI_STATE_BUCKET"
          namespace        = "$OCI_NAMESPACE"
          key              = "civilbeefy/terraform.tfstate"
          region           = "$TF_VAR_region"
          tenancy_ocid     = "$TF_VAR_tenancy_ocid"
          user_ocid        = "$TF_VAR_user_ocid"
          fingerprint      = "$TF_VAR_fingerprint"
          private_key_path = "$key"
          EOF

      - name: terraform init
        run: terraform init -input=false -no-color -backend-config="$RUNNER_TEMP/backend.hcl"

      - name: terraform ${{ inputs.action }}
        id: run
        run: |
          # Piano + controllo: senza allow_destroy non si elimina né si ricrea nulla
          # (tranne le risorse rimaste a metà da un tentativo fallito).
          plan() {
            terraform plan -input=false -no-color -out=tfplan "$@" || return 1
            terraform show -json tfplan > plan.json
            deletes=$(jq -r '.resource_changes[]? | select(.change.actions | index("delete"))
              | select(.action_reason != "replace_because_tainted") | .address' plan.json)
            if [ -n "$deletes" ] && [ "$ALLOW_DESTROY" != "true" ]; then
              echo "::error::Il piano eliminerebbe o ricreerebbe: $(echo $deletes). Rilancia con allow_destroy solo se è voluto."
              return 1
            fi
          }
          # Applica; esce con 3 se Oracle non ha macchine A1 libere in questo momento.
          apply() {
            set +e
            terraform apply -input=false -no-color tfplan 2>&1 | tee apply.log
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ] && grep -qiE 'out of (host )?capacity' apply.log; then return 3; fi
            return "$rc"
          }

          set -e
          plan
          if [ "$ACTION" != "apply" ]; then exit 0; fi

          rc=0; apply || rc=$?
          if [ "$rc" -eq 3 ] && [ "$SMALL_SHAPE_FALLBACK" = "true" ] && [ "$TF_VAR_ocpus" != "1" ]; then
            echo "::notice::Nessuna capacità con $TF_VAR_ocpus OCPU e $TF_VAR_memory_gb GB: provo con 1 OCPU e 6 GB."
            export TF_VAR_ocpus=1 TF_VAR_memory_gb=6
            plan
            rc=0; apply || rc=$?
          fi
          if [ "$rc" -eq 3 ]; then
            echo "::warning::Oracle non ha macchine A1 libere in questo momento: nuovo tentativo alla prossima esecuzione."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna capacità A1 disponibile ora: la rete è pronta, la macchina verrà creata a un prossimo tentativo." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"

          ip=$(terraform output -raw public_ip)
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "public_ip=$ip" >> "$GITHUB_OUTPUT"
          echo "shape=$(terraform output -raw shape)" >> "$GITHUB_OUTPUT"

      - name: Impronta SSH della macchina
        if: steps.run.outputs.ready == 'true'
        env:
          IP: ${{ steps.run.outputs.public_ip }}
          SHAPE: ${{ steps.run.outputs.shape }}
        run: |
          # Alla prima creazione SSH risponde dopo 1-2 minuti.
          for i in $(seq 1 30); do
            hostkey=$(ssh-keyscan -T 5 -t ed25519 "$IP" 2>/dev/null) && [ -n "$hostkey" ] && break
            sleep 10
          done
          {
            echo "## Macchina pronta"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| IP pubblico (fisso) | \`$IP\` |"
            echo "| Macchina | $SHAPE |"
            echo
            echo "Il primo avvio installa Docker e apre le porte: attendi 5 minuti prima del Deploy."
            echo
            echo "Nell'environment **production**: \`OCI_SSH_HOST\` = \`$IP\`, e \`OCI_SSH_KNOWN_HOSTS\` ="
            echo
            echo '```'
            echo "${hostkey:-(non ancora disponibile: rilancia più tardi, oppure usa ssh-keyscan dal tuo PC)}"
            echo '```'
            echo
            echo "Nel DNS (DuckDNS o dominio): record A verso \`$IP\`."
          } >> "$GITHUB_STEP_SUMMARY"
