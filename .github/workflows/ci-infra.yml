name: CI Infrastruttura

# Verifica dei file Terraform (formato e validità), senza credenziali e senza toccare Oracle Cloud.

on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/ci-infra.yml
      - .github/workflows/infra.yml
      - .github/workflows/infra-retry.yml
  push:
    branches: [main]
    paths:
      - infra/terraform/**

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/oracle
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
