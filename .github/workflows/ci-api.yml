name: CI API

# Verifica (build e test). Le immagini le pubblica release-images.yml a ogni push su main.

on:
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/ci-api.yml', '.github/scripts/controlla-migrazioni.sh']
  pull_request:
    paths: ['apps/api/**', '.github/workflows/ci-api.yml', '.github/scripts/controlla-migrazioni.sh']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Numerazione delle migrazioni Flyway (ADR 0013): con piu' branch aperti due PR possono
  # prenotare lo stesso numero, e in produzione il deploy si fermerebbe. Qui l'errore emerge
  # nella pull request. Il checkout di una PR non porta il ramo di base: va preso a parte
  # (profondita' 1: allo script serve solo l'elenco dei file, non la storia). Se il fetch
  # fallisce il job fallisce, perche' un controllo saltato in silenzio sarebbe peggio di niente.
  migrazioni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Numerazione delle migrazioni
        env:
          RIFERIMENTO: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 origin "$RIFERIMENTO:refs/remotes/origin/$RIFERIMENTO"
          .github/scripts/controlla-migrazioni.sh "origin/$RIFERIMENTO"

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # I test di integrazione usano Testcontainers (PostgreSQL 17): Docker è già presente sui runner ubuntu.
      - name: Build e test
        run: ./mvnw -B verify
      - name: Pubblica il JAR
        uses: actions/upload-artifact@v7
        with:
          name: gestionale-api-jar
          path: apps/api/target/*.jar
      # Catena di fornitura: scansiona il jar (dipendenze dirette e transitive incluse) e fallisce
      # la CI sulle vulnerabilità HIGH/CRITICAL con una correzione disponibile. Dependabot
      # (.github/dependabot.yml) le aggiorna.
      - name: Scansione vulnerabilità dipendenze (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/api/target
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      # Elenco licenze delle dipendenze, pubblicato come artifact (non committato: cambia a ogni
      # aggiornamento di dipendenza, lo rigenera la CI).
      - name: Elenco licenze delle dipendenze
        run: ./mvnw -B org.codehaus.mojo:license-maven-plugin:2.10.0:add-third-party
      - name: Pubblica elenco licenze
        uses: actions/upload-artifact@v7
        with:
          name: licenze-api
          path: apps/api/target/generated-sources/license/THIRD-PARTY.txt
