name: CI API

on:
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/ci-api.yml']
  pull_request:
    paths: ['apps/api/**', '.github/workflows/ci-api.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # I test di integrazione usano Testcontainers (PostgreSQL 17): Docker è già presente sui runner ubuntu.
      - name: Build e test
        run: ./mvnw -B verify
      - name: Pubblica il JAR
        uses: actions/upload-artifact@v7
        with:
          name: gestionale-api-jar
          path: apps/api/target/*.jar

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/gestionale-api
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
