name: CI API

# Verifica (build e test). Le immagini le pubblica release-images.yml a ogni push su main.

on:
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/ci-api.yml']
  pull_request:
    paths: ['apps/api/**', '.github/workflows/ci-api.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # I test di integrazione usano Testcontainers (PostgreSQL 17): Docker è già presente sui runner ubuntu.
      - name: Build e test
        run: ./mvnw -B verify
      - name: Pubblica il JAR
        uses: actions/upload-artifact@v7
        with:
          name: gestionale-api-jar
          path: apps/api/target/*.jar
