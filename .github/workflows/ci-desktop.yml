name: CI Desktop

# Installer Windows dell'app desktop (Tauri 2): .msi e setup .exe come artifact.
# Gli installer NON sono ancora firmati (vedi apps/desktop/README.md, "Firma e aggiornamenti").
#
# Sulle pull request verifica la build. Su main lo richiama "Release immagini", che mette gli
# installer nell'immagine web (pagina /app-desktop): niente build doppia, i minuti Windows costano doppio.
#
# Cache per contenuto (chiave = hash di apps/web, apps/desktop e di questo file): se un rilascio
# non cambia nulla che l'app desktop incapsula, riusa l'installer già costruito invece di
# ricompilarlo. Decide il contenuto, non il commit: coerente con un ritorno indietro (ADR 0004),
# che ripropone lo stesso contenuto e quindi la stessa chiave.

on:
  pull_request:
    paths: ['apps/desktop/**', 'apps/web/**', '.github/workflows/ci-desktop.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          key: desktop-installer-${{ hashFiles('apps/web/**', 'apps/desktop/**', '.github/workflows/ci-desktop.yml') }}
      - uses: actions/setup-node@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: steps.cache.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Dipendenze web
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: npm ci
      - name: Dipendenze desktop
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npm ci
      # beforeBuildCommand (tauri.conf.json) esegue prima la build di produzione di apps/web.
      - name: Build installer
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npm run build
      - name: Pubblica gli installer
        uses: actions/upload-artifact@v7
        with:
          name: gestionale-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
