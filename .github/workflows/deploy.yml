name: Deploy

# Installa una versione di civil beefy sulla macchina di produzione, via SSH: qualsiasi server
# Linux con Docker (VPS come Aruba o OVH, oppure Oracle Cloud). I nomi OCI_* sono storici.
#
# Quando parte:
#   - da solo alla fine di "Release immagini" (ogni merge su main), se la variabile di repository
#     AUTO_DEPLOY = true: il job aspetta l'APPROVAZIONE nell'environment "production"
#     (Required reviewers), poi installa;
#   - a mano: Actions → Deploy → Run workflow (anche per tornare a un commit precedente).
# Guide: docs/deploy-vps.md (VPS), docs/deploy-oracle-cloud.md (Oracle Cloud)
#
# Configurazione nell'environment GitHub "production" (Settings → Environments):
#   secrets:   OCI_SSH_HOST, OCI_SSH_USER, OCI_SSH_PRIVATE_KEY, OCI_SSH_KNOWN_HOSTS
#   variables: APP_DOMAIN, OCI_APP_DIR (facoltativa, default /opt/civilbeefy)
#   protezione: Required reviewers (chi approva i deploy), Deployment branches = main

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit di main da installare (vuoto = l'ultimo). Per tornare indietro, indica un commit precedente.
        required: false
        type: string
  workflow_call:
    inputs:
      commit:
        description: Commit da installare (40 caratteri)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    # Un deploy alla volta; un deploy in attesa di approvazione viene sostituito dal più recente.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      APP_DIR: ${{ vars.OCI_APP_DIR || '/opt/civilbeefy' }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Versione da installare
        id: version
        env:
          REQUESTED: ${{ inputs.commit }}
        run: |
          sha="${REQUESTED:-$GITHUB_SHA}"
          if ! echo "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Indica il commit completo (40 caratteri esadecimali)."; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$sha" >> "$GITHUB_OUTPUT"

      # Strumenti del deploy dalla versione corrente del workflow; configurazione (compose, realm,
      # tema) dalla versione da installare, in release/: così anche un ritorno indietro funziona.
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.sha }}
          path: release

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Le immagini di questo commit esistono?
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          for image in gestionale-api gestionale-web; do
            if ! docker buildx imagetools inspect "$REGISTRY/$image:$TAG" > /dev/null; then
              echo "::error::Immagine $image:$TAG non trovata: attendi la fine del workflow 'Release immagini' per questo commit."
              exit 1
            fi
          done

      - uses: ./.github/actions/ssh-server
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          user: ${{ secrets.OCI_SSH_USER }}
          private-key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}

      - name: Controlla la macchina
        env:
          DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          [ -n "$DOMAIN" ] || { echo "::error::Manca la variabile APP_DOMAIN nell'environment production."; exit 1; }
          # Controlli sulla macchina prima di toccare qualcosa: errori chiari invece di un compose che fallisce.
          ssh server bash -s "$APP_DIR" "$DOMAIN" <<'EOF'
          set -e
          dir="$1"; domain="$2"
          command -v docker > /dev/null || { echo "::error::Docker non è installato sulla macchina: lancia il workflow Prepara server (docs/deploy-vps.md)."; exit 1; }
          docker info > /dev/null 2>&1 || { echo "::error::L'utente $(whoami) non può usare Docker: lancia il workflow Prepara server, oppure sudo usermod -aG docker $(whoami)."; exit 1; }
          docker compose version > /dev/null 2>&1 || { echo "::error::Manca il plugin Docker Compose sulla macchina."; exit 1; }
          [ -f "$dir/.env" ] || { echo "::error::Manca $dir/.env sulla macchina: lancia il workflow Prepara server (docs/deploy-vps.md)."; exit 1; }
          grep -qx "APP_DOMAIN=$domain" "$dir/.env" || { echo "::error::APP_DOMAIN nel .env della macchina non è $domain (variabile APP_DOMAIN dell'environment)."; exit 1; }
          grep -Eq '^ACME_EMAIL=[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$' "$dir/.env" || { echo "::error::ACME_EMAIL nel .env non è un indirizzo email valido: serve a Let's Encrypt per il certificato."; exit 1; }
          free=$(df -Pk "$dir" | awk 'NR==2 {print int($4 / 1048576)}')
          [ "$free" -ge 5 ] || echo "::warning::Sulla macchina restano solo $free GB liberi."
          echo "Macchina pronta: $(docker --version), $free GB liberi."
          EOF

      - name: Copia la configurazione sulla macchina
        working-directory: release
        run: |
          ssh server "mkdir -p '$APP_DIR/keycloak/realm' '$APP_DIR/keycloak/themes'"
          scp infra/deploy/oracle/compose.yml infra/deploy/oracle/Caddyfile server:"$APP_DIR/"
          scp infra/keycloak/realm/gestionale-realm.json server:"$APP_DIR/keycloak/realm/"
          tar -C infra/keycloak/themes -cf - gestionale | ssh server "rm -rf '$APP_DIR/keycloak/themes/gestionale' && tar -C '$APP_DIR/keycloak/themes' -xf -"

      - name: Aggiorna i servizi
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          ACTOR: ${{ github.actor }}
        run: |
          # La configurazione (compose + .env) deve essere completa prima di scaricare qualcosa.
          ssh server "cd '$APP_DIR' && docker compose config -q"
          # Il token (valido solo per questo job) passa sull'input standard, non sulla riga di comando.
          printf '%s' "$TOKEN" | ssh server "docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh server "set -e
            cd '$APP_DIR'
            if grep -q '^IMAGE_TAG=' .env; then sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/' .env; else echo 'IMAGE_TAG=$TAG' >> .env; fi
            docker compose pull --quiet || { docker logout ghcr.io; exit 1; }
            docker logout ghcr.io
            docker compose up -d --remove-orphans
            docker image prune -f > /dev/null
            docker compose ps"

      - name: Verifica
        env:
          DOMAIN: ${{ vars.APP_DOMAIN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/api/health"; then
              echo
              echo "Installata la versione $TAG"
              echo "Installata **$TAG** su https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::L'API non risponde su https://$DOMAIN/api/health"
          ssh server "cd '$APP_DIR' && docker compose ps && docker compose logs --tail=80 api"
          exit 1
