name: CI Web

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'infra/docker/web.Dockerfile', 'infra/docker/nginx.conf', 'infra/docker/web/**', '.github/workflows/ci-web.yml']
  pull_request:
    paths: ['apps/web/**', 'infra/docker/web.Dockerfile', 'infra/docker/nginx.conf', 'infra/docker/web/**', '.github/workflows/ci-web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build di produzione
        run: npm run build -- --configuration production
      # Angular 22 esegue i test con Vitest + jsdom: non serve un browser (niente --browsers=ChromeHeadless, che vale per Karma).
      - name: Test
        run: npm test -- --watch=false
      - name: Pubblica la build
        uses: actions/upload-artifact@v7
        with:
          name: gestionale-web-dist
          path: apps/web/dist/

  # Verifica che l'immagine web (usata da "podman compose --profile app") si costruisca: non viene pubblicata.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build immagine web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: gestionale-web:ci
