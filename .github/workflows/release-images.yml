name: Release immagini

# A ogni push su main costruisce e pubblica su GHCR le immagini di API e web per amd64 e arm64
# (VPS x86 o Oracle Cloud Ampere A1), con le etichette:
#   sha-<commit completo>  → usata dal workflow Deploy: ogni commit di main ha una coppia coerente
#   latest                 → ultima versione di main
# L'immagine web contiene anche i pacchetti dell'app dello stesso commit (pagina /app-desktop):
# gli installer Windows e l'APK Android. Se una delle due build fallisce le immagini escono
# comunque: senza installer se manca il desktop, con la sola parte Windows se manca l'APK.
#
# Alla fine:
#   - di norma NON installa: il riepilogo indica la versione pronta e il link a Deploy, che si avvia
#     a mano (l'avvio manuale è l'approvazione; repository privato senza GitHub Enterprise);
#   - con la variabile di repository AUTO_DEPLOY = true richiama Deploy per lo stesso commit. Da usare
#     SOLO se l'environment "production" ha i Required reviewers (repository pubblico o GitHub
#     Enterprise): altrimenti installerebbe senza conferma.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  desktop:
    uses: ./.github/workflows/ci-desktop.yml

  android:
    uses: ./.github/workflows/android.yml
    # Chiave di firma dell'APK (ANDROID_KEYSTORE_BASE64 e compagni).
    secrets: inherit

  image:
    needs: [desktop, android]
    # Le immagini del server non dipendono dall'esito delle build dell'app.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Le immagini si pubblicano in ordine; un deploy in attesa di approvazione non blocca i rilasci successivi.
    concurrency:
      group: release-image-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - name: gestionale-api
            context: apps/api
            file: apps/api/Dockerfile
          - name: gestionale-web
            context: .
            file: infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Installer dell'app desktop
        if: matrix.name == 'gestionale-web' && needs.desktop.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: gestionale-desktop-windows
          path: ${{ runner.temp }}/desktop
      - name: APK dell'app Android
        if: matrix.name == 'gestionale-web' && needs.android.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: gestionale-android-apk
          path: ${{ runner.temp }}/android
      - name: Pacchetti dell'app nella web app
        if: matrix.name == 'gestionale-web'
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          if [ "$DESKTOP_RESULT" != "success" ]; then
            echo "::warning::Build desktop non riuscita: l'immagine web esce senza installer (pagina /app-desktop non disponibile)."
            exit 0
          fi
          apk_dir=''
          if [ "$ANDROID_RESULT" = "success" ]; then
            apk_dir="$RUNNER_TEMP/android"
          else
            echo "::warning::Build Android non riuscita: la pagina /app-desktop offrirà solo i pacchetti Windows."
          fi
          sh infra/docker/web/prepare-desktop-downloads.sh "$RUNNER_TEMP/desktop" apps/web/public/downloads "$GITHUB_SHA" "$apk_dir"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Installazione in produzione dello stesso commit, dopo l'approvazione (environment production).
  deploy:
    needs: image
    if: vars.AUTO_DEPLOY == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      commit: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read

  # Senza deploy automatico: versione pronta, da installare avviando Deploy a mano.
  ready:
    needs: image
    if: vars.AUTO_DEPLOY != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Versione pronta da installare
        env:
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy.yml
        run: |
          {
            echo "## Versione pronta"
            echo
            echo "Immagini \`sha-$GITHUB_SHA\` pubblicate. Per installarle in produzione:"
            echo "**[Deploy → Run workflow]($URL)** (campo *commit* vuoto = questa versione)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Versione pronta: per installarla avvia Deploy (Actions → Deploy → Run workflow)."
