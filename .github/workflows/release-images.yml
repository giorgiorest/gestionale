name: Release immagini

# A ogni push su main costruisce e pubblica su GHCR le immagini di API e web per amd64 e arm64
# (VPS x86 o Oracle Cloud Ampere A1), con le etichette:
#   sha-<commit completo>  → usata dal workflow Deploy: ogni commit di main ha una coppia coerente
#   latest                 → ultima versione di main
# L'immagine web contiene anche gli installer Windows dell'app desktop dello stesso commit
# (pagina /app-desktop). Se la build desktop fallisce le immagini escono comunque, senza installer.
#
# Alla fine:
#   - job "approvazione": apre l'issue «Rilascio pronto» e aspetta un commento /deploy (o /annulla)
#     da chi ha accesso in scrittura, al massimo DEPLOY_APPROVAL_MINUTES (default 30); con /deploy
#     parte il job "deploy" nello stesso run. Script: .github/scripts/attendi-approvazione.sh;
#   - con la variabile di repository AUTO_DEPLOY = true il deploy parte subito: da usare SOLO se
#     l'environment "production" ha i Required reviewers (repository pubblico o GitHub Enterprise).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  desktop:
    uses: ./.github/workflows/ci-desktop.yml

  image:
    needs: desktop
    # Le immagini del server non dipendono dall'esito della build desktop.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Le immagini si pubblicano in ordine; un deploy in attesa di approvazione non blocca i rilasci successivi.
    concurrency:
      group: release-image-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - name: gestionale-api
            context: apps/api
            file: apps/api/Dockerfile
          - name: gestionale-web
            context: .
            file: infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Installer dell'app desktop
        if: matrix.name == 'gestionale-web' && needs.desktop.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: gestionale-desktop-windows
          path: ${{ runner.temp }}/desktop
      - name: Installer nella web app
        if: matrix.name == 'gestionale-web'
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          if [ "$DESKTOP_RESULT" != "success" ]; then
            echo "::warning::Build desktop non riuscita: l'immagine web esce senza installer (pagina /app-desktop non disponibile)."
            exit 0
          fi
          sh infra/docker/web/prepare-desktop-downloads.sh "$RUNNER_TEMP/desktop" apps/web/public/downloads "$GITHUB_SHA"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Approvazione nello stesso run: un'issue «Rilascio pronto» e l'attesa del commento /deploy.
  # I Required reviewers degli environment, nei repository privati, richiedono GitHub Enterprise.
  approvazione:
    needs: image
    if: vars.AUTO_DEPLOY != 'true'
    runs-on: ubuntu-latest
    # L'attesa consuma minuti di Actions: al massimo DEPLOY_APPROVAL_MINUTES (default 30).
    timeout-minutes: 40
    # Un rilascio più recente sostituisce quello in attesa.
    concurrency:
      group: approvazione-rilascio
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    outputs:
      approved: ${{ steps.wait.outputs.approved }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy.yml
          WAIT_MINUTES: ${{ vars.DEPLOY_APPROVAL_MINUTES || '30' }}
        run: bash .github/scripts/attendi-approvazione.sh

  # Installazione in produzione dello stesso commit: dopo /deploy sull'issue, oppure subito
  # (in attesa dei Required reviewers) con AUTO_DEPLOY = true su piani che li offrono.
  deploy:
    needs: [image, approvazione]
    if: >-
      ${{ !cancelled() && needs.image.result == 'success' &&
          (vars.AUTO_DEPLOY == 'true' || needs.approvazione.outputs.approved == 'true') }}
    uses: ./.github/workflows/deploy.yml
    with:
      commit: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
