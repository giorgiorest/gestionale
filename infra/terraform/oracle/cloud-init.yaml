#cloud-config
# Primo avvio della macchina (eseguito una sola volta da cloud-init).
# Equivale ai passi 2 e 4 di docs/deploy-oracle-cloud.md; il file .env si crea a mano.

package_update: true
package_upgrade: true
packages:
  - unattended-upgrades
  - ca-certificates
  - curl

runcmd:
  # Le immagini Ubuntu di Oracle bloccano tutto tranne SSH: apre 80 e 443 prima della regola REJECT.
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p udp --dport 443 -j ACCEPT
  - netfilter-persistent save
  # Docker Engine e Docker Compose.
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  # Cartella dell'applicazione, usata dal workflow Deploy.
  - mkdir -p ${app_dir}
  - chown ubuntu:ubuntu ${app_dir}
  - touch /var/lib/cloud/civilbeefy-ready
