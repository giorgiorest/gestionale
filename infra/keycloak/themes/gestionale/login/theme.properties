# Tema di login del gestionale.
# Eredita da keycloak.v2 (template, testi, PatternFly 5) e cambia solo l'aspetto:
# gli aggiornamenti di Keycloak continuano ad applicarsi.
parent=keycloak.v2
import=common/keycloak

# styles.css è quello di keycloak.v2 (risolto dal tema padre); gestionale.css lo personalizza.
styles=css/styles.css css/gestionale.css

# Marchio dell'installazione (nome, logo, colori) letto da /config.json: js/branding.js.
scripts=js/branding.js

# Stesso aspetto chiaro dell'applicazione.
darkMode=false
