server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API sullo stesso dominio: environment.prod.ts usa apiUrl = '/api'.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker, manifest e configurazione non vanno messi in cache, per ricevere subito gli aggiornamenti.
    location ~ ^/(ngsw-worker\.js|ngsw\.json|manifest\.webmanifest|config\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # Routing lato client della SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
