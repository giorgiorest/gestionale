server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API sullo stesso dominio: environment.prod.ts usa apiUrl = '/api'.
    location /api/ {
        proxy_pass http://api:8080;
        # Host con la porta e X-Forwarded-*: l'API deve vedere l'indirizzo pubblico, altrimenti le
        # richieste di scrittura (che hanno l'header Origin) sembrano cross-origin e vengono rifiutate.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker e manifest non vanno messi in cache, per ricevere subito gli aggiornamenti.
    location ~ ^/(ngsw-worker\.js|ngsw\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Configurazione dell'installazione: pubblica (nessun segreto), letta anche dall'app desktop
    # che gira su un'origine propria (http://tauri.localhost, tauri://localhost).
    location = /config.json {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # Pacchetti dell'app, Windows e Android (pagina /app-desktop): sempre l'ultima versione,
    # scaricati come file.
    location = /downloads/desktop.json {
        add_header Cache-Control "no-cache";
    }
    location ~ ^/downloads/.+\.(exe|msi|apk)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        # nginx non conosce .apk: senza questo tipo Android non riconosce il file da installare.
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
    }

    # Routing lato client della SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
