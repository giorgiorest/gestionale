# Stack locale di civil beefy per podman-compose (consigliato), podman compose e Docker Compose.
# Guida: docs/avvio-locale.md
#
# Due modalità, dalla cartella infra/docker (dopo aver copiato .env.example in .env):
#
#   podman-compose up -d                     solo servizi di supporto: database (con db-init), Keycloak, Mailpit.
#                                            API e web si avviano a mano (mvnw / npm start), per sviluppare.
#   podman-compose --profile app up -d --build
#                                            tutto in container, anche API e web: per provare l'app
#                                            senza installare Java e Node.
#
# In entrambe la web app è su http://localhost:4200 (Keycloak non va riconfigurato).
# Le immagini hanno il nome completo (docker.io/…, quay.io/…) come richiesto da Podman.
name: gestionale

services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestionale}
      # Utente proprietario dello schema, usato solo dalle migrazioni Flyway.
      POSTGRES_USER: ${POSTGRES_USER:-gestionale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?impostare POSTGRES_PASSWORD in infra/docker/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # Forma "exec" (senza shell): funziona con Docker Compose e con podman-compose, che non
      # converte bene la forma CMD-SHELL. Via TCP (-h localhost), così il server temporaneo della
      # prima inizializzazione (solo socket locale) non viene scambiato per pronto.
      test: ["CMD", "pg_isready", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    # Crea (o riallinea al .env) il ruolo con cui si collega l'applicazione: non superuser, non
    # proprietario delle tabelle, senza BYPASSRLS. I privilegi sulle tabelle li concede Flyway.
    # Il comando è scritto qui e non in uno script montato: niente problemi di fine riga (CRLF)
    # sulle copie del repository scaricate su Windows. Gira a ogni avvio e poi termina.
    image: docker.io/library/postgres:17
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-gestionale}
      PGUSER: ${POSTGRES_USER:-gestionale}
      PGPASSWORD: ${POSTGRES_PASSWORD:?impostare POSTGRES_PASSWORD in infra/docker/.env}
      APP_USER: ${DB_USER:-gestionale_app}
      APP_PASSWORD: ${DB_PASSWORD:?impostare DB_PASSWORD in infra/docker/.env}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -v app_user="$$APP_USER" -v app_password="$$APP_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS', :'app_user')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
        SELECT format('ALTER ROLE %I PASSWORD %L', :'app_user', :'app_password') \gexec
        SQL
        echo "Ruolo applicativo $$APP_USER pronto"

  keycloak:
    # Provider di identità (OIDC). Il realm "gestionale" è configurazione di prodotto versionata
    # in infra/keycloak/realm; gli utenti demo (infra/keycloak/dev) si caricano solo in sviluppo.
    # Dati non persistenti (start-dev): a ogni nuovo container il realm viene reimportato.
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?impostare KEYCLOAK_ADMIN_PASSWORD in infra/docker/.env}
      # URL pubblico di Keycloak: è l'issuer dei token, deve essere lo stesso visto da browser e API.
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Indirizzo della web app, usato nel realm per redirect e CORS.
      GESTIONALE_WEB_URL: ${GESTIONALE_WEB_URL:-http://localhost:4200}
    volumes:
      - ../keycloak/realm/gestionale-realm.json:/opt/keycloak/data/import/gestionale-realm.json:ro,z
      - ../keycloak/dev/gestionale-users-0.json:/opt/keycloak/data/import/gestionale-users-0.json:ro,z
      # Tema della pagina di login (logo, colori e font dell'applicazione).
      - ../keycloak/themes/gestionale:/opt/keycloak/themes/gestionale:ro,z
    ports:
      - "8180:8080"

  mailpit:
    # Server SMTP di sviluppo: cattura le email delle notifiche (interfaccia su http://localhost:8025).
    image: docker.io/axllent/mailpit:v1.34.0
    ports:
      - "8025:8025"
      - "1025:1025"

  # ------------------------------------------------------------------ profilo "app"

  api:
    profiles: ["app"]
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/gestionale}
      DB_USER: ${DB_USER:-gestionale_app}
      DB_PASSWORD: ${DB_PASSWORD:?impostare DB_PASSWORD in infra/docker/.env}
      DB_MIGRATION_USER: ${POSTGRES_USER:-gestionale}
      DB_MIGRATION_PASSWORD: ${POSTGRES_PASSWORD:?impostare POSTGRES_PASSWORD in infra/docker/.env}
      JWT_ISSUER_URI: ${KEYCLOAK_URL:-http://localhost:8180}/realms/gestionale
      # Le chiavi di firma si leggono dalla rete interna; l'issuer resta quello pubblico.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/gestionale/protocol/openid-connect/certs
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      # Email delle notifiche (in produzione: SMTP reale e mittente dell'azienda).
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-civil beefy <noreply@localhost>}
      EMAIL_INCLUDE_BODY: ${EMAIL_INCLUDE_BODY:-true}
      APP_PUBLIC_URL: ${GESTIONALE_WEB_URL:-http://localhost:4200}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "8080:8080"

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      - api
    environment:
      # Generano config.json all'avvio del container (infra/docker/web/40-runtime-config.sh).
      WEB_API_URL: /api
      OIDC_AUTHORITY: ${KEYCLOAK_URL:-http://localhost:8180}/realms/gestionale
      OIDC_CLIENT_ID: gestionale-web
      # Marchio dell'installazione (facoltativo): senza valori si usa quello di prodotto.
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      BRAND_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-}
      BRAND_ACCENT_COLOR: ${BRAND_ACCENT_COLOR:-}
    ports:
      # Stessa porta di "npm start": Keycloak accetta un solo indirizzo della web app.
      - "4200:80"

volumes:
  db-data:
