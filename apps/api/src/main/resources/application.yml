# Configurazione comune. Il profilo attivo si sceglie con SPRING_PROFILES_ACTIVE (default: dev).
spring:
  application:
    name: gestionale-api
  profiles:
    default: dev
  datasource:
    # Connessione dell'applicazione: ruolo NON superuser e NON proprietario delle tabelle,
    # così la Row Level Security si applica sempre.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    # Le migrazioni girano con un utente distinto, proprietario dello schema.
    url: ${DB_URL}
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
    placeholders:
      # Ruolo applicativo a cui la migrazione concede i privilegi DML.
      appRole: ${spring.datasource.username}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        # Convenzione unica per le liste (ADR 0014): page da 0, size 50 di default, 200 al massimo
        # (oltre viene ridotto, senza errore).
        default-page-size: 50
        max-page-size: 200
  security:
    oauth2:
      resourceserver:
        jwt:
          # Provider di identità OIDC (Keycloak, realm "gestionale"). Contattato alla prima richiesta autenticata.
          issuer-uri: ${JWT_ISSUER_URI}
          # Il token deve essere emesso per questa API (claim aud).
          audiences: ${JWT_AUDIENCE:gestionale-api}

server:
  port: 8080
  # L'API sta dietro un reverse proxy (nginx): usa X-Forwarded-Host/Proto per conoscere l'indirizzo
  # pubblico (controllo CORS sullo stesso sito, URL generati). Non esporre la porta dell'API su Internet.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

gestionale:
  cors:
    # Origini dell'app desktop (Tauri). Altre origini: CORS_ALLOWED_ORIGINS, separate da virgola.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://tauri.localhost,tauri://localhost}
  security:
    # Claim JWT con i ruoli applicativi (admin, operator, viewer).
    roles-claim: roles
  tenancy:
    # Nome del claim JWT che contiene l'id del tenant.
    tenant-claim: tenant_id
  licensing:
    # Chiave pubblica Ed25519 (X.509 SubjectPublicKeyInfo, Base64) per verificare le licenze offline.
    public-key: ${LICENSE_PUBLIC_KEY:}
  notifications:
    email:
      # Email delle notifiche. Server SMTP: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD.
      enabled: ${EMAIL_ENABLED:false}
      from: ${MAIL_FROM:Civil Beefy <noreply@localhost>}
      # Indirizzo pubblico della web app, per il link "apri la comunicazione".
      app-url: ${APP_PUBLIC_URL:}
      # false = nell'email solo titolo e link (per comunicazioni riservate).
      include-body: ${EMAIL_INCLUDE_BODY:true}
  observability:
    health-alert:
      # Email dell'amministratore dell'installazione, avvisato quando /actuator/health cambia
      # stato (non un tenant: usa lo stesso server SMTP delle notifiche, MAIL_FROM come mittente).
      # Vuoto = solo log ERROR, nessuna email.
      to: ${HEALTH_ALERT_EMAIL:}
  demo:
    # Il seeder del tenant demo è disattivato salvo configurazione esplicita.
    enabled: false
  platform:
    # Console di amministrazione della piattaforma (ADR 0010): realm separato degli amministratori.
    jwt:
      # Issuer pubblico del realm "piattaforma"; vuoto = console disattivata (ogni richiesta 401).
      issuer-uri: ${PLATFORM_JWT_ISSUER_URI:}
      # Chiavi di firma dalla rete interna (facoltativo).
      jwk-set-uri: ${PLATFORM_JWK_SET_URI:}
    keycloak:
      # Gestione degli utenti delle aziende: indirizzo interno di Keycloak e client di servizio.
      base-url: ${PLATFORM_KEYCLOAK_URL:}
      client-secret: ${PLATFORM_KEYCLOAK_CLIENT_SECRET:}
  ai:
    # Provider AI: "none" usa NoopAiProvider (risponde 503).
    provider: ${AI_PROVIDER:none}
    # La chiave arriva solo da variabile d'ambiente; mai nel codice o nel repository.
    api-key: ${AI_API_KEY:}
  attachments:
    # Allegati (ADR 0016): archivio compatibile S3, mai byte attraverso l'API — solo URL firmati.
    # Nessun default in produzione: S3_BUCKET, S3_ACCESS_KEY e S3_SECRET_KEY sono obbligatori.
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      # true per gli archivi self-hosted (MinIO e simili); false per S3 reale (virtual-hosted style).
      force-path-style: ${S3_FORCE_PATH_STYLE:true}
    max-size-bytes: ${ATTACHMENTS_MAX_SIZE_BYTES:26214400}
    # Verificato lato server alla richiesta di un URL di caricamento: il tipo dichiarato dal client
    # non è attendibile da solo (ADR 0016 punto 7). Immagini e PDF per cominciare.
    allowed-mime-types: ${ATTACHMENTS_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/heic,image/webp,application/pdf}
    # Durata dell'URL firmato: "ordine di minuti" (ADR 0016).
    presigned-url-duration: ${ATTACHMENTS_PRESIGNED_URL_DURATION:PT10M}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestionale}
    username: ${DB_USER:gestionale_app}
    password: ${DB_PASSWORD:gestionale_app}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestionale}
    user: ${DB_MIGRATION_USER:gestionale}
    password: ${DB_MIGRATION_PASSWORD:gestionale}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/gestionale}

  # Email in sviluppo: Mailpit (SMTP su 1025, caselle su http://localhost:8025).
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

gestionale:
  demo:
    enabled: ${DEMO_ENABLED:true}
  platform:
    jwt:
      issuer-uri: ${PLATFORM_JWT_ISSUER_URI:http://localhost:8180/realms/piattaforma}
    keycloak:
      base-url: ${PLATFORM_KEYCLOAK_URL:http://localhost:8180}
      # Solo sviluppo locale (stesso valore di infra/docker/compose.yml); in produzione dal .env.
      client-secret: ${PLATFORM_KEYCLOAK_CLIENT_SECRET:sviluppo-locale-non-usare-in-produzione}
  notifications:
    email:
      enabled: ${EMAIL_ENABLED:true}
      app-url: ${APP_PUBLIC_URL:http://localhost:4200}
  attachments:
    # MinIO locale (infra/docker/compose.yml): stesso bucket/credenziali del container di sviluppo.
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      bucket: ${S3_BUCKET:gestionale-dev}
      access-key: ${S3_ACCESS_KEY:gestionale}
      # Solo sviluppo locale (stesso valore di infra/docker/compose.yml); in produzione dal .env.
      secret-key: ${S3_SECRET_KEY:sviluppo-locale-non-usare-in-produzione}

---
spring:
  config:
    activate:
      on-profile: prod
  # In prod nessun default: DB_URL, DB_USER, DB_PASSWORD, DB_MIGRATION_USER,
  # DB_MIGRATION_PASSWORD e JWT_ISSUER_URI sono obbligatori.

gestionale:
  demo:
    enabled: ${DEMO_ENABLED:false}

management:
  endpoint:
    health:
      show-details: never
