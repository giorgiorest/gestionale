[package]
name = "gestionale-desktop"
version = "0.1.0"
description = "App desktop di civil beefy (Tauri 2)"
authors = ["civil beefy"]
license = "UNLICENSED"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "gestionale_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6" }

# Dipendenze comuni a tutte le piattaforme (Windows, macOS, Linux, Android).
[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7" }
tauri-plugin-log = "2"

# Plugin e librerie che esistono solo su desktop (vassoio di sistema, gestione finestre,
# scorciatoie globali, aggiornamento automatico) vanno qui, non in [dependencies]:
# su Android non si compilano. Nel codice si proteggono con #[cfg(desktop)].
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
