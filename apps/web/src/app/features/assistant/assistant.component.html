<div class="page narrow">
  <div class="page-header"><h1>Assistente</h1></div>
  <mat-card appearance="outlined" class="chat">
    <mat-card-content class="messages">
      @for (message of messages(); track $index) {
        <div class="message" [class.user]="message.role === 'user'">
          <span class="who">{{ message.role === 'user' ? 'Tu' : 'Assistente' }}</span>
          <p>{{ message.content }}</p>
        </div>
      } @empty {
        <p class="muted">Scrivi una domanda per iniziare.</p>
      }
    </mat-card-content>
    <mat-card-actions>
      <form (ngSubmit)="send()" class="input">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="grow">
          <mat-label>Messaggio</mat-label>
          <input matInput name="draft" [(ngModel)]="draft" />
        </mat-form-field>
        <button mat-flat-button type="submit" [disabled]="!draft.trim()"><mat-icon>send</mat-icon>Invia</button>
      </form>
    </mat-card-actions>
  </mat-card>
</div>
